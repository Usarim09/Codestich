<!DOCTYPE html>
<html>
<head>
  <title>CodeStitch</title>
  <style>
    body { font-family: sans-serif; padding: 10px; width: 320px; background-color: #fff; transition: background 0.2s; }
    body.dark { background-color: #1e1e1e; color: #eee; }
    .snippet { border: 1px solid #ccc; margin-bottom: 10px; padding: 6px; border-radius: 6px; background: #f4f4f4; position: relative; transition: transform 0.1s ease-in-out; }
    body.dark .snippet { background: #2c2c2c; border-color: #444; }
    .snippet:hover { transform: scale(1.01); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .meta { font-size: 12px; color: #666; margin-bottom: 4px; }
    .code-preview { background: #eaeaea; padding: 5px; white-space: pre-wrap; max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 4px; }
    body.dark .code-preview { background: #333; color: #eee; }
    button { margin: 5px 2px; padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-row { display: flex; justify-content: space-between; margin-top: 5px; }
    .note-input { width: 100%; font-size: 12px; padding: 3px; margin-top: 4px; border-radius: 4px; border: 1px solid #ccc; }
    .toolbar { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
    .toggle-btn { background: #2ea44f; color: #fff; }
    #exportBtn { position: sticky; bottom: 0; width: 100%; background: #0366d6; color: white; font-weight: bold; margin-top: 10px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <h3 style="margin:0;">CodeStitch</h3>
    <button id="themeToggle" class="toggle-btn">🌗</button>
  </div>
  <div id="snippetList"></div>
  <button id="exportBtn">📦 Export Project</button>
  <script src="popup.js"></script>
</body>
</html>
